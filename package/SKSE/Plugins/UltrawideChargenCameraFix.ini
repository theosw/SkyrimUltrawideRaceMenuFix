[Settings]
; Camera distance multiplier for the character creation menu.
; 0 = automatic: real aspect ratio divided by 16:9. On a 32:9 display this
; resolves to 2.0, on 21:9 to ~1.31, and on 16:9 it does nothing.
fDistanceScale = 0.0

; Extra multiplier applied on top, for taste. 1.0 = exact 16:9 framing,
; 1.1 = 10% farther out. Re-read every time the menu opens, so you can tune
; it without restarting the game.
fUserScale = 1.0

; Log per-update camera details to UltrawideChargenCameraFix.log.
bVerboseLog = false
